name: CI - Multi-Agent Travel Planner

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Backend CI (Python / FastAPI / Pytest)
  # ==========================================
  backend-ci:
    name: Backend Lint, Test & Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Backend Directory
        id: locate-backend
        run: |
          if [ -d "backend" ]; then
            echo "dir=backend" >> $GITHUB_OUTPUT
          elif [ -d "travel-agent-workspace/backend" ]; then
            echo "dir=travel-agent-workspace/backend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            **/requirements.txt

      - name: Install Dependencies
        run: |
          cd ${{ steps.locate-backend.outputs.dir }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Compilation Verification
        run: |
          cd ${{ steps.locate-backend.outputs.dir }}
          python -m compileall app

      - name: Run Pytest Test Suite
        run: |
          cd ${{ steps.locate-backend.outputs.dir }}
          pytest -v tests/

      - name: Verify Backend Docker Build
        run: |
          docker build -t travel-backend:ci ${{ steps.locate-backend.outputs.dir }}

  # ==========================================
  # 2. Frontend CI (Next.js 15 / TypeScript)
  # ==========================================
  frontend-ci:
    name: Frontend Typecheck, Build & Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Frontend Directory
        id: locate-frontend
        run: |
          if [ -d "frontend" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
          elif [ -d "travel-agent-workspace/frontend" ]; then
            echo "dir=travel-agent-workspace/frontend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            **/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd ${{ steps.locate-frontend.outputs.dir }}
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript Typecheck
        run: |
          cd ${{ steps.locate-frontend.outputs.dir }}
          npx tsc --noEmit

      - name: Next.js Production Build
        run: |
          cd ${{ steps.locate-frontend.outputs.dir }}
          npm run build

      - name: Verify Frontend Docker Build
        run: |
          docker build -t travel-frontend:ci ${{ steps.locate-frontend.outputs.dir }}

  # ==========================================
  # 3. Docker Compose Orchestration Validation
  # ==========================================
  docker-compose-validate:
    name: Docker Compose Syntax & Health Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Docker Compose File
        id: locate-compose
        run: |
          if [ -f "docker-compose.yml" ]; then
            echo "file=docker-compose.yml" >> $GITHUB_OUTPUT
          elif [ -f "travel-agent-workspace/docker-compose.yml" ]; then
            echo "file=travel-agent-workspace/docker-compose.yml" >> $GITHUB_OUTPUT
          fi

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f ${{ steps.locate-compose.outputs.file }} config
