services:
  # PostgreSQL Service for Agno Agent Session Persistence & Memory
  postgres:
    image: postgres:16-alpine
    container_name: travel_planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_agent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-travel_agent_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_agent -d travel_agent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travel_network

  # FastAPI Multi-Agent Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_planner_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-travel-planner-super-secret-jwt-key-min32chars}
      - POSTGRES_USER=${POSTGRES_USER:-travel_agent}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-travel_agent_secret}
      - POSTGRES_DB=${POSTGRES_DB:-travel_agent_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/callback/google}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel_network

  # Next.js 15 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel_planner_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://wanderlust-voyage-ai.onrender.com}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    networks:
      - travel_network

volumes:
  postgres_data:
    driver: local

networks:
  travel_network:
    driver: bridge
