services:
  - type: web
    name: wanderlust-voyage-ai-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: wanderlust-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://wanderlust-frontend-rvw9.onrender.com/api/auth/callback/google
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: https://wanderlust-frontend-rvw9.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://wanderlust-frontend-rvw9.onrender.com,http://localhost:3000,http://127.0.0.1:3000,*

databases:
  - name: wanderlust-db
    databaseName: travel_agent_db
    user: travel_agent
    plan: free
