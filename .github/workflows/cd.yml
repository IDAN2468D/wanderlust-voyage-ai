name: CD - Deploy Multi-Agent Travel Planner

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        id: prep
        run: |
          # OCI / Docker images MUST have lowercase repository names
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Workspace Directory
        id: locate-workspace
        run: |
          if [ -d "backend" ]; then
            echo "base=." >> $GITHUB_OUTPUT
          else
            echo "base=travel-agent-workspace" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.locate-workspace.outputs.base }}/backend
          file: ${{ steps.locate-workspace.outputs.base }}/backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.prep.outputs.image_prefix }}/backend:latest
            ${{ steps.prep.outputs.image_prefix }}/backend:${{ github.sha }}

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.locate-workspace.outputs.base }}/frontend
          file: ${{ steps.locate-workspace.outputs.base }}/frontend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.prep.outputs.image_prefix }}/frontend:latest
            ${{ steps.prep.outputs.image_prefix }}/frontend:${{ github.sha }}
